{% extends "base.html" %}
{% load static %}
{% block title %}Delete {{ object.name }}{% endblock %}

{% block content %}
<div class="container mx-auto mt-6">
  <h1>Delete “{{ object.name }}”?</h1>
  <form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete this recipe?</p>
    <button type="submit" class="button">Yes, delete</button>
    <a href="{% url 'recipes:detail' object.pk %}" class="button secondary">Cancel</a>
  </form>
</div>
{% endblock %}
