{% extends "base.html" %}
{% block title %}Edit Pantry Item{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Edit — {{ item.ingredient.name }}</h1>
</div>

<div class="card" style="max-width:480px;">
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Quantity on hand</label>
      <input type="text" name="quantity" value="{{ item.quantity }}" placeholder="e.g. 3 lbs">
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea name="notes" rows="3" placeholder="e.g. expires June 2026">{{ item.notes }}</textarea>
    </div>
    <div class="btn-group">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'pantry:index' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
